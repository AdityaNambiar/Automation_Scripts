########################################################################################
## Flexcube logging configuration file
########################################################################################
## 
## Created two appenders fcrjlog with level as FATAL and fcrjdebuglog with level as DEBUG.
## All the FATAL errors will be logged in the fcrjlog and all debug/trace statements from 
## all fcr classes will be logged in fcrjdebuglog and also in fcrjlog since its additivity 
## is set to true.
##
## Additivity means adding to the root log file, which in this case is fcrjlog. To enable
## a particular package logging statments just uncommment the statment for that package
## and we will get the logs for that package in the fcrjdebuglog. Also to have those 
## statments in fcrjlog set the additivity for that pacakage to true.
## For e.g. To enable only APP classes debug statements in fcrjlog do following;
##          1) Comment the fcr debug statments.
##              
##				 #logger.fcrjdebuglog.name = com.ofss.fc
##				 #logger.fcrjdebuglog.level = DEBUG
##				 #logger.fcrjdebuglog.additivity = flase
##				 #logger.fcrjdebuglog.appenderRef.RollingFile.ref = fcrjdebuglog
##
##	    	2) Uncomment and set the additivity of app debug statments to true.
##
##               logger.fcrjdebuglog.name = com.ofss.fc
##               logger.fcrjdebuglog.level = DEBUG
##               logger.fcrjdebuglog.additivity = true
##               logger.fcrjdebuglog.appenderRef.RollingFile.ref = fcrjdebuglog
##
## Thus we will get debug statments from fcr.app classes in fcrjlog and all other debug
## statments in fcrjdebuglog.
## 
## Those who want logging 765 entity log please remove comment from 765 entity logs which present below and add their respective appender into appenders and loggers as well
## For e.g. if want to add 765.fcrjoltplog then add below in appender
##	appenders =  765.fcrjoltplog
##	and uncomment 
##		#appender.765.fcrjdebuglog.type = RollingFile
##		#appender.765.fcrjdebuglog.name = 765.fcrjdebuglog
##		#appender.765.fcrjdebuglog.fileName = ${sys:fc.log.dir}/765/logs/fcrjdebuglog/fcrjdebuglog.txt
##		#appender.765.fcrjdebuglog.filePattern = ${sys:fc.log.dir}/765/logs/fcrjdebuglog/fcrjdebuglog-%d{MM-dd-yyyy}-%i.txt
##		#appender.765.fcrjdebuglog.layout.type = PatternLayout
##		#appender.765.fcrjdebuglog.layout.pattern = %d{ISO8601} %5p [%t] %c: %m%n
##		#appender.765.fcrjdebuglog.policies.type = Policies
##		#appender.765.fcrjdebuglog.policies.time.type = TimeBasedTriggeringPolicy
##		#appender.765.fcrjdebuglog.policies.time.interval = 1
##		#appender.765.fcrjdebuglog.policies.time.modulate = true
##		#appender.765.fcrjdebuglog.policies.size.type = SizeBasedTriggeringPolicy
##		#appender.765.fcrjdebuglog.policies.size.size=10000KB
##		#appender.765.fcrjdebuglog.strategy.type = DefaultRolloverStrategy
##		#appender.765.fcrjdebuglog.strategy.max = 20
##	add same 765.fcrjoltplog into loggers
##	uncomment
##		#logger.765.fcrjdebuglog.name = 765.com.ofss.fc
##		#logger.765.fcrjdebuglog.level = FATAL
##		#logger.765.fcrjdebuglog.additivity = true
##		#logger.765.fcrjdebuglog.appenderRef.RollingFile.ref = 765.fcrjdebuglog
##
##Significance of layout pattern as below
##	%d{ISO8601} : Represent date format having values "ABSOLUTE", "DATE" and "ISO8601" for specifying AbsoluteTimeDateFormat, DateTimeDateFormat and respectively ISO8601DateFormat.
##	%p			: Represent the priority of the logging event.
##	[%t]		: Represent the name of the thread that generated the logging event.
##	%c			: Represent the category of the logging event.	
##	%m			: Represent the application supplied message associated with the logging event.
##	%n			: Represetn the platform dependent line separator character or characters.

################################################################################################################################################################################

#######################################################
## ROOT LOGGER
#######################################################

rootLogger.level = ALL
rootLogger.appenderRefs = root
rootLogger.appenderRef.root.ref = fcrjlog

#######################################################
## APPENDERS
#######################################################
 
appenders = fcrjlog, fcrjdebuglogs, paymentlog, fcrjmowauditlog, fcrjoltpauditlog, fcrjapiauditlog, BATCH.BatchExceptionlog, BATCH.ERRORLOG.Batchlog, NORMALGEFU.NORMALGEFULog, BPRGGEFU.BPRGGEFULog, BAC.BACLog, PNU.PNULog, SALARY.SALARYLog, DPC.DPCLog, CUST.CUSTLog, CLEARING.CLEARINGLog, DEFAULT.DEFAULTLog, BAO.BAOLog, fcrjproclog, fcrjhttplog, fcrjmntlog, fcrjoltplog, fcrjdebuglog, 765.fcrjproclog, 765.fcrjhttplog, 765.fcrjmntlog, 765.fcrjoltplog, 765.fcrjdebuglog, 765.BATCH.BatchExceptionlog, 765.BATCH.ERRORLOG.Batchlog, 765.fcrjdebuglogs, 765.fcrjdebug


#######################################################
## LOG FILE LOCATIONS
#######################################################

## fcrjlog rolling file appender
#######################################################

appender.fcrjlog.type = RollingFile
appender.fcrjlog.name = fcrjlog
appender.fcrjlog.fileName = ${sys:fc.log.dir}/logs/fcrjlog/fcrjlog.txt
appender.fcrjlog.filePattern = ${sys:fc.log.dir}/logs/fcrjlog/fcrjlog-%d{MM-dd-yyyy}-%i.txt
appender.fcrjlog.layout.type = PatternLayout
appender.fcrjlog.layout.pattern = %d{ISO8601} %5p [%t] %c: %m%n
appender.fcrjlog.policies.type = Policies
appender.fcrjlog.policies.time.type = TimeBasedTriggeringPolicy
appender.fcrjlog.policies.time.interval = 1
appender.fcrjlog.policies.time.modulate = true
appender.fcrjlog.policies.size.type = SizeBasedTriggeringPolicy
appender.fcrjlog.policies.size.size=10000KB
appender.fcrjlog.strategy.type = DefaultRolloverStrategy
appender.fcrjlog.strategy.max = 80

#loggers = fcrjlog

#logger.fcrjlog.name = com.ofss.fc
#logger.fcrjlog.level = FATAL
#logger.fcrjlog.additivity = false
#logger.fcrjlog.appenderRef.fcrjlog.ref = fcrjlog

